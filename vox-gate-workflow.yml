name: VOX quality gate

on:
  pull_request:
  push:
    branches: [main]
  merge_group:

jobs:
  vox-quality-gate:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout video project
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Checkout trusted gate repository
        uses: actions/checkout@v4
        with:
          repository: taobaobinhthuan1405-bit/vox-quality-gates
          ref: v1.0.2
          path: trusted-gates

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install video dependencies
        run: npm ci

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install gate dependencies
        run: python -m pip install pillow numpy scipy

      - name: Run trusted VOX gate
        env:
          VOX_BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha || github.event.before }}
        run: |
          python trusted-gates/vox-collage-video/ci_gate.py \
            --root "$GITHUB_WORKSPACE" \
            --changed-from "$VOX_BASE_SHA" \
            --render-review

      - name: Upload review contact sheet
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: vox-review-contact-sheet
          path: input/review_frames/contact_sheet.jpg
          if-no-files-found: ignore
          retention-days: 7
