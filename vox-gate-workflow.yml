name: VOX quality gate

on:
  pull_request:
  push:
    branches: [main]
  merge_group:

jobs:
  vox-quality-gate:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout video project
        uses: actions/checkout@v4

      - name: Checkout trusted gate repository
        uses: actions/checkout@v4
        with:
          repository: YOUR_GITHUB_OWNER/vox-quality-gates
          ref: v1.0.0
          path: trusted-gates

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install gate dependencies
        run: python -m pip install pillow numpy scipy

      - name: Run trusted VOX gate
        run: python trusted-gates/vox-collage-video/ci_gate.py --root "$GITHUB_WORKSPACE"
